services:
  go:
    image: lee-schedule-display-toolchain:local
    build:
      context: .
      dockerfile: .compose/Dockerfile
    working_dir: /workspace
    command: ["sh", "-c", "bun install --cwd web --frozen-lockfile && exec air"]
    environment:
      DATABASE_PATH: /data/schedule.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      LISTEN_ADDR: 0.0.0.0:8080
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    ports:
      # Publish only on the host loopback interface.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - web_modules:/workspace/web/node_modules
      - dev_data:/data

volumes:
  web_modules:
  dev_data:
