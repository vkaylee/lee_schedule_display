services:
  go:
    profiles: ["unit-go", "int-go", "lint-go"]
    image: lee-schedule-display-toolchain:local
    build:
      context: ..
      dockerfile: .compose/Dockerfile
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ..:/workspace
      - test_modules:/workspace/web/node_modules
      - test_dist:/workspace/web/dist
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build

volumes:
  test_modules:
    name: lee-schedule-display-test-modules
  go_modules:
    name: lee-schedule-display-test-go-modules
  go_build:
    name: lee-schedule-display-test-go-build
  test_dist:
