services:
  go:
    profiles: ["unit-go", "int-go", "lint-go"]
    image: lee-schedule-display-toolchain:local
    build:
      context: ..
      dockerfile: .compose/Dockerfile
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ..:/workspace
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    tmpfs:
      - /workspace/web/node_modules:exec
      - /workspace/web/dist

volumes:
  go_modules:
    external: true
    name: lee-schedule-display-test-go-modules
  go_build:
    external: true
    name: lee-schedule-display-test-go-build
